[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbridge"
version = "0.1.0"
description = "A governed Strands agent for public-safe field-service handoffs."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "strands-agents>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "pip-audit>=2.7,<3",
  "playwright>=1.50,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldbridge = ["web/*.html", "web/*.css", "web/*.js"]

[tool.coverage.run]
branch = true
source = ["fieldbridge"]
# Cloud persistence adapters are exercised with recording fakes, but their
# boto3 conditional-expression/error branches are deployment-only and cannot
# be meaningfully covered by the local synthetic run.
omit = ["src/fieldbridge/aws_adapters.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
