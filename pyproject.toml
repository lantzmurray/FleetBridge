[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbridge"
version = "0.1.0"
description = "A governed Strands agent for public-safe field-service handoffs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "strands-agents>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["fieldbridge"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
