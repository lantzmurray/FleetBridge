<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">FieldBridge AWS deployment architecture</title>
  <desc id="desc">A coordinator uses a synthetic-only web interface through WAF and API Gateway. A Lambda FastAPI facade stores events in DynamoDB and invokes a Strands worker in Bedrock AgentCore Runtime. The worker uses Nova Lite and bounded synthetic tools, with CloudWatch observability. A human reviews the decision card. Operational actions remain disconnected.</desc>
  <defs>
    <style>
      .bg{fill:#07121f}.panel{fill:#102338;stroke:#31506b;stroke-width:2}.aws{fill:#172b42;stroke:#ffb84d;stroke-width:2}.safe{fill:#102f2b;stroke:#43d9a3;stroke-width:2}.blocked{fill:#351c29;stroke:#ff6b8a;stroke-width:2;stroke-dasharray:8 7}.title{font:700 31px system-ui,sans-serif;fill:#f5f8fb}.sub{font:500 16px system-ui,sans-serif;fill:#a9bdd0}.head{font:700 18px system-ui,sans-serif;fill:#fff}.text{font:500 14px system-ui,sans-serif;fill:#c7d5e2}.status{font:700 14px system-ui,sans-serif;fill:#ffcc76}.arrow{stroke:#79b8ef;stroke-width:3;fill:none;marker-end:url(#end)}.deny{stroke:#ff6b8a;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#deny)}
    </style>
    <marker id="end" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#79b8ef"/></marker>
    <marker id="deny" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff6b8a"/></marker>
  </defs>
  <rect class="bg" width="1440" height="850"/>
  <text class="title" x="60" y="64">FieldBridge: bounded investigation before a truck rolls</text>
  <text class="sub" x="60" y="94">Professional Agents track • synthetic-only public demo • human review remains authoritative</text>
  <text class="status" x="60" y="124">AWS deployment status: UNKNOWN until stack outputs, runtime revision, and live traces are verified</text>

  <rect class="panel" x="60" y="180" rx="15" width="220" height="105"/>
  <text class="head" x="85" y="220">Coordinator browser</text><text class="text" x="85" y="247">Seeded scenario inbox</text><text class="text" x="85" y="269">No free-form tickets</text>
  <rect class="aws" x="340" y="180" rx="15" width="210" height="105"/>
  <text class="head" x="365" y="220">AWS WAF</text><text class="text" x="365" y="247">Managed rules</text><text class="text" x="365" y="269">POST rate limit</text>
  <rect class="aws" x="610" y="180" rx="15" width="210" height="105"/>
  <text class="head" x="635" y="220">API Gateway</text><text class="text" x="635" y="247">Throttled REST API</text><text class="text" x="635" y="269">Same-origin UI</text>
  <rect class="aws" x="880" y="180" rx="15" width="250" height="105"/>
  <text class="head" x="905" y="220">Lambda + FastAPI</text><text class="text" x="905" y="247">Allowlist, quotas, reviews</text><text class="text" x="905" y="269">HMAC source identifier</text>
  <path class="arrow" d="M280 232 H332"/><path class="arrow" d="M550 232 H602"/><path class="arrow" d="M820 232 H872"/>

  <rect class="aws" x="880" y="365" rx="15" width="250" height="110"/>
  <text class="head" x="905" y="405">DynamoDB ledger</text><text class="text" x="905" y="432">Run + immutable events</text><text class="text" x="905" y="454">Encrypted • 24-hour TTL</text>
  <path class="arrow" d="M1005 285 V357"/>

  <rect class="aws" x="1170" y="180" rx="15" width="220" height="105"/>
  <text class="head" x="1195" y="220">AgentCore Runtime</text><text class="text" x="1195" y="247">Strands investigation</text><text class="text" x="1195" y="269">IAM-invoked worker</text>
  <path class="arrow" d="M1130 232 H1162"/>
  <rect class="aws" x="1170" y="365" rx="15" width="220" height="110"/>
  <text class="head" x="1195" y="405">Amazon Nova Lite</text><text class="text" x="1195" y="432">Explicit model ID</text><text class="text" x="1195" y="454">Bedrock inference</text>
  <path class="arrow" d="M1280 285 V357"/>

  <rect class="safe" x="60" y="365" rx="15" width="560" height="110"/>
  <text class="head" x="85" y="403">Bounded synthetic tools</text>
  <text class="text" x="85" y="431">case • contract • history • site access • routing</text>
  <text class="text" x="85" y="455">fulfillment • deterministic validation • safety boundary</text>
  <path class="arrow" d="M1170 255 C970 325,830 420,628 420"/>

  <rect class="aws" x="670" y="365" rx="15" width="160" height="110"/>
  <text class="head" x="695" y="405">CloudWatch</text><text class="text" x="695" y="432">Logs + metrics</text><text class="text" x="695" y="454">Sanitized traces</text>
  <path class="arrow" d="M1170 265 C1010 350,955 420,838 420"/>

  <rect class="safe" x="350" y="590" rx="15" width="390" height="125"/>
  <text class="head" x="375" y="630">Evidence-linked decision card</text>
  <text class="text" x="375" y="658">Approve draft • request changes • reject</text>
  <text class="text" x="375" y="684">Review creates an audit event, not an action</text>
  <path class="arrow" d="M1000 285 C980 550,800 652,748 652"/>
  <rect class="panel" x="60" y="600" rx="15" width="220" height="105"/>
  <text class="head" x="85" y="640">Human coordinator</text><text class="text" x="85" y="667">Decision authority</text><text class="text" x="85" y="689">Evidence correction</text>
  <path class="arrow" d="M342 652 H288"/>
  <rect class="blocked" x="900" y="590" rx="15" width="490" height="125"/>
  <text class="head" x="925" y="630">Deliberately disconnected</text>
  <text class="text" x="925" y="658">Execute dispatch • parts ordering • customer contact</text>
  <text class="text" x="925" y="684">Production ticket changes • operational closure</text>
  <path class="deny" d="M280 680 C520 810,800 790,892 685"/>
  <text class="sub" x="60" y="800">Deterministic policy is authoritative. Model failure returns a labeled degraded review packet; it never fabricates a live trace.</text>
</svg>
